<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img"><title>Okul dağılımı: çerçeve ve tabakalı seçim</title><desc>Her satır kendi toplamına göre yüzdedir; GP yeşil, MS mavi. Çerçeve 395, seçilmiş örneklem 40 kayıttır.</desc><rect width="760" height="330" fill="white"/><g font-family="sans-serif" fill="#173a3b"><text x="24" y="34" font-size="21">Okul bileşimi: sayı ile yüzdeyi ayır</text><text x="24" y="74" font-size="16">Çerçeve · N=395</text><rect x="24" y="90" width="600.8101" height="36" fill="#087f5b"/><rect x="624.8101" y="90" width="79.1899" height="36" fill="#1f4e79"/><text x="24" y="147" font-size="15">GP: 349 (%88.35) · MS: 46 (%11.65)</text><text x="24" y="179" font-size="16">Tabakalı seçim · N=40</text><rect x="24" y="195" width="595.0000" height="36" fill="#087f5b"/><rect x="619.0000" y="195" width="85.0000" height="36" fill="#1f4e79"/><text x="24" y="252" font-size="15">GP: 35 (%87.50) · MS: 5 (%12.50)</text><text x="24" y="302" font-size="14">Ağırlıklı hesap: GP için 349/35; MS için 46/5. Gerçek seçilmiş N=40.</text></g></svg>